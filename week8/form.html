<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise</title>
    <link rel="stylesheet" href="css/form.css">
</head>

<body>
    <h1>Registration Form - Middle School</h1>

    <form action="/action_page.php">
        <div class="textbox"><br>
            <label for="fname">First name*</label><br>
            <input type="text" id="fname" name="fname"><br>
        </div>

        <div class="textbox"><br>
            <label for="lname">Last name*</label><br>
            <input type="text" id="lname" name="lname"><br><br>
        </div>

        <div class="textbox"><br><br>
            <label for="date">Date of Birth*</label><br>
            <input type="date" id="DoB" name="DoB"><br><br>
        </div>

        <div class="textbox"><br><br>
            <label for="email">Email Address*</label><br>
            <input type="email" id="email" name="email"><br><br>
        </div>
    </form>

    <h3> Select Your Favourite Colors</h3>

    <form>
        <input type="checkbox" id="color1" name="color1" value="Blue">
        <label for="color1"> Blue</label><br>
        <input type="checkbox" id="color2" name="color2" value="Red">
        <label for="color2"> Red</label><br>
        <input type="checkbox" id="color3" name="color3" value="Green">
        <label for="color3"> Green</label><br><br>

        <div class="button"><br>
            <input type="submit" value="Submit">
        </div>
    </form>

</body>

</html>
